<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,minimum-scale=1,user-scalable=no" />

  <!--
    商用說明（請保留此段註解 / 或在你專案的 THIRD-PARTY-NOTICES 中保留）
    - simple-keyboard: MIT License  (https://www.npmjs.com/package/simple-keyboard)
    - JsBarcode:      MIT License  (https://github.com/lindell/JsBarcode)
  -->

  <link rel="stylesheet" href="lib/simple-keyboard/index.css" />

  <title>載具輸入產生條碼</title>

  <style>
    html, body {
      margin: 0;
      overflow: hidden;
      -webkit-user-select: none;
      user-select: none;
      -webkit-touch-callout: none;
      touch-action: manipulation;
    }
    body {
      background: #0f0f10;
      color: #fff;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, "Noto Sans TC", Arial;
      display: flex;
      min-height: 100vh;
      align-items: center;
      justify-content: center;
      padding: 24px;
      box-sizing: border-box;
    }
    input, textarea {
      -webkit-user-select: text;
      user-select: text;
    }

    .panel {
      width: min(900px, 100%);
      background: rgba(255,255,255,0.04);
      border: 1px solid rgba(255,255,255,0.06);
      border-radius: 24px;
      padding: 22px;
      box-shadow: 0 18px 60px rgba(0,0,0,0.55);
    }

    .title {
      font-size: 28px;
      font-weight: 700;
      margin: 0 0 10px;
      letter-spacing: 1px;
    }

    .hint {
      margin: 0 0 10px;
      opacity: 0.78;
      font-size: 14px;
      line-height: 1.45;
    }

    #input {
      width: 100%;
      font-size: 30px;
      padding: 16px 18px;
      border-radius: 16px;
      border: 1px solid rgba(255,255,255,0.12);
      background: rgba(0,0,0,0.35);
      color: #fff;
      outline: none;
      box-sizing: border-box;
      letter-spacing: 2px;
      text-transform: uppercase;
    }
    #input::placeholder { color: rgba(255,255,255,0.35); }

    .err {
      margin-top: 10px;
      color: #ffb4b4;
      font-size: 14px;
      display:none;
    }

    .barcodeBox {
      margin-top: 14px;
      background: #ffffff;
      border: 1px dashed rgba(0,0,0,0.18);
      border-radius: 18px;
      padding: 12px;
      display:flex;
      align-items:center;
      justify-content:center;
      min-height: 150px;
      overflow: hidden;
    }

    #barcode { background: transparent; border-radius: 12px; padding: 0; }
    #barcode svg { display: block; max-width: 100%; height: auto; }

    .simple-keyboard.hg-theme-default {
      margin-top: 16px;
      background: #1d1f22;
      padding: 16px;
      border-radius: 22px;
      box-shadow: inset 0 0 0 1px rgba(255,255,255,0.06);
    }

    .simple-keyboard .hg-button {
      background: #2e3136;
      color: #ffffff !important;
      border-radius: 14px;
      height: 62px;
      font-size: 20px;
      border: 1px solid rgba(255,255,255,0.08);
      touch-action: manipulation;
      user-select: none;
    }

    .simple-keyboard .hg-button span { color: #ffffff !important; }
    .simple-keyboard .hg-button:hover { background: #3a3e45; }
    .simple-keyboard .hg-button:active { background: #4b515b; }

    .simple-keyboard .hg-button[data-skbtn="{bksp}"] { background: #3b3b3b; }
    .simple-keyboard .hg-button[data-skbtn="{clear}"] { background: #6b4b00; font-weight: 700; }
    .simple-keyboard .hg-button[data-skbtn="{enter}"] { background: #c62828; font-weight: 800; width: 190px; font-size: 18px; }
    .simple-keyboard .hg-button[data-skbtn="{gen}"] { background: #000000; font-weight: 800; width: 160px; }

    .card-templates {
      margin-top: 16px;
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 12px;
    }
    .card-option {
      width: 100%;
      border-radius: 12px;
      cursor: pointer;
      border: 3px solid transparent;
      box-shadow: 0 6px 18px rgba(0,0,0,0.5);
      transition: transform .15s ease, box-shadow .15s ease, border-color .15s ease;
      background: rgba(0,0,0,0.2);
      min-height: 120px;
    }
    .card-option:hover {
      transform: translateY(-2px);
      box-shadow: 0 10px 24px rgba(0,0,0,0.7);
    }
    .card-option.selected {
      border-color: #ffd54f;
    }
    .preview-box {
      margin-top: 18px;
      padding: 12px;
      border-radius: 18px;
      background: #fff;
      display: flex;
      justify-content: center;
      align-items: center;
    }
    .flip-card {
      width: min(100%, 860px);
      aspect-ratio: 1.58 / 1;
      perspective: 1400px;
      user-select: none;
      touch-action: pan-y;
    }
    .flip-inner {
      position: relative;
      width: 100%;
      height: 100%;
      transform-style: preserve-3d;
      transition: transform .58s cubic-bezier(.2,.7,.2,1);
    }
    .flip-inner.is-back {
      transform: rotateY(180deg);
    }
    .flip-face {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 14px;
      overflow: hidden;
      backface-visibility: hidden;
      -webkit-backface-visibility: hidden;
    }
    .flip-face.back {
      transform: rotateY(180deg);
    }
    .flip-face canvas {
      max-width: 100%;
      width: 100%;
      height: auto;
      display: block;
    }
    .flip-hint {
      margin-top: 10px;
      font-size: 13px;
      color: #000;
      font-weight: 700;
      text-align: center;
    }
    .buttons-row {
      margin-top: 18px;
      display: flex;
      justify-content: center;
      gap: 16px;
    }
    .buttons-row button {
      padding: 0;
      border: none;
      background: transparent;
      cursor: pointer;
      line-height: 0;
      touch-action: manipulation;
    }
    .buttons-row button img {
      display: block;
      width: auto;
      height: auto;
      max-width: min(42vw, 280px);
      pointer-events: none;
    }

    @media (max-width: 480px) {
      #input { font-size: 24px; }
      .simple-keyboard .hg-button { height: 54px; font-size: 18px; }
      #barcode { transform: scale(0.95); transform-origin: center; }
    }

    .idle-screen {
      position: fixed;
      inset: 0;
      z-index: 0;
      background: #000;
      overflow: hidden;
    }

    .idle-screen.is-click-to-start {
      cursor: pointer;
    }

    .idle-carousel {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
    }

    .idle-carousel__slide {
      position: absolute;
      inset: 0;
      background-repeat: no-repeat;
      background-size: contain;
      background-position: center;
      opacity: 0;
      transition: opacity 0.8s ease-in-out;
      pointer-events: none;
    }

    .idle-carousel__slide.is-active {
      opacity: 1;
    }

    .input-screen {
      position: fixed;
      inset: 0;
      z-index: 0;
      display: none;
      overflow: hidden;
      background: #000;
    }

    .input-screen__bg {
      position: absolute;
      inset: 0;
      background-repeat: no-repeat;
      background-size: contain;
      background-position: center;
      pointer-events: none;
    }

    .input-screen__content {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      padding: 24vh 6vw 6vh;
      box-sizing: border-box;
      gap: 10px;
    }

    .input-screen #input {
      background: rgba(255, 251, 244, 0.94);
      color: #4a3520;
      border: 2px solid rgba(139, 90, 43, 0.28);
    }

    .input-screen #input::placeholder {
      color: rgba(74, 53, 32, 0.45);
    }

    .input-screen .barcodeBox {
      background: rgba(255, 255, 255, 0.96);
      margin-bottom: 0;
    }

    .input-screen .simple-keyboard.hg-theme-default {
      margin-top: 0;
      background: rgba(29, 31, 34, 0.92);
      flex-shrink: 0;
    }

    .print-screen {
      position: fixed;
      inset: 0;
      z-index: 0;
      display: none;
      overflow: hidden;
      background: #000;
    }

    .print-screen__bg {
      position: absolute;
      inset: 0;
      background-repeat: no-repeat;
      background-size: contain;
      background-position: center;
      pointer-events: none;
    }

    .choose-screen {
      position: fixed;
      inset: 0;
      z-index: 0;
      display: none;
      overflow: hidden;
      background: #000;
      flex-direction: column;
      align-items: center;
      padding-bottom: 50px;
      box-sizing: border-box;
    }

    .choose-screen__bg {
      position: absolute;
      inset: 0;
      background-repeat: no-repeat;
      background-size: contain;
      background-position: center;
      pointer-events: none;
    }

    .choose-screen__content {
      position: relative;
      flex: 1 1 auto;
      width: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      overflow-y: auto;
      min-height: 0;
      padding: calc(18vh + 10px) 4vw 0;
      box-sizing: border-box;
    }

    .choose-screen__content > * {
      width: min(100%, 720px);
    }

    .choose-screen__templates {
      width: min(92vw, 900px);
      margin-top: 0;
    }

    .choose-screen__templates-row {
      display: flex;
      gap: 18px;
      justify-content: center;
      flex-wrap: wrap;
    }

    .choose-screen__templates-row > div {
      min-width: 0;
      flex: 1 1 100%;
    }

    .choose-screen .title {
      color: #4a3520;
      text-align: center;
    }

    .choose-screen__section-title {
      margin: 0 0 10px;
    }

    .choose-screen .card-templates {
      margin-top: 0;
      gap: 14px;
    }

    .choose-screen .card-option {
      min-height: 132px;
      border-radius: 14px;
      background: #ebe4d8;
    }

    .choose-screen .preview-box {
      width: min(98vw, 840px);
      padding: 4px 6px;
    }

    .choose-screen .flip-card {
      width: 100%;
      aspect-ratio: 1.58 / 1;
      min-height: 420px;
      margin: 0 auto;
    }

    .choose-screen .flip-face {
      align-items: stretch;
      justify-content: stretch;
    }

    .choose-screen .flip-face canvas {
      width: 100%;
      height: 100%;
      display: block;
    }

    .choose-screen__preview-section {
      flex-shrink: 0;
      margin-top: auto;
      margin-bottom: 100px;
      width: min(98vw, 840px);
      z-index: 1;
    }

    .choose-screen__preview-section > .title {
      margin-top: 0;
      margin-bottom: 10px;
    }

    .choose-screen__footer {
      position: relative;
      flex-shrink: 0;
      z-index: 1;
      display: flex;
      justify-content: center;
      gap: 20px;
      width: 100%;
      pointer-events: none;
    }

    .choose-screen__footer .buttons-row {
      margin-top: 0;
      pointer-events: auto;
    }

    .choose-screen__footer .buttons-row button img {
      max-width: min(44vw, 300px);
    }

    @media (orientation: portrait) {
      .choose-screen__content {
        padding-top: calc(18vh + 10px);
      }

      .choose-screen__templates {
        width: min(94vw, 920px);
      }

      .choose-screen .card-option {
        min-height: 148px;
      }

      .choose-screen .preview-box {
        width: min(98vw, 880px);
      }

      .choose-screen .flip-card {
        min-height: 480px;
      }

      .choose-screen__preview-section {
        width: min(98vw, 880px);
      }

    }

    .secret-hotspot {
      position: fixed;
      top: 0;
      right: 0;
      width: 90px;
      height: 90px;
      z-index: 2147483646;
      background: transparent;
    }

    .secret-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.55);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 2147483647;
    }

    .secret-keypad,
    .secret-menu {
      width: 320px;
      background: #111;
      color: #fff;
      border-radius: 12px;
      padding: 20px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.35);
    }

    .secret-menu { width: 280px; }

    .secret-title {
      font-size: 18px;
      text-align: center;
      margin-bottom: 16px;
    }

    .secret-input {
      text-align: center;
      font-size: 22px;
      letter-spacing: 4px;
      padding: 10px 0 6px;
    }

    .secret-error {
      text-align: center;
      color: #ff8a8a;
      font-size: 14px;
      margin-bottom: 8px;
    }

    .secret-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 10px;
      margin-top: 6px;
    }

    .secret-grid .key {
      height: 48px;
      font-size: 18px;
      border-radius: 8px;
      border: none;
      background: #2b2b2b;
      color: #fff;
      cursor: pointer;
    }

    .secret-grid .key.secondary { background: #3b3b3b; }

    .secret-actions {
      display: flex;
      justify-content: space-between;
      margin-top: 14px;
      gap: 10px;
    }

    .secret-actions .btn {
      flex: 1;
      height: 40px;
      border-radius: 8px;
      border: none;
      font-size: 16px;
      cursor: pointer;
    }

    .secret-actions .btn.ghost {
      background: transparent;
      color: #fff;
      border: 1px solid #555;
    }

    .secret-actions .btn.primary {
      background: #4f8cff;
      color: #fff;
    }

    .menu-btn {
      display: block;
      width: 100%;
      height: 44px;
      margin-bottom: 10px;
      font-size: 16px;
      border-radius: 8px;
      border: none;
      background: #2b2b2b;
      color: #fff;
      cursor: pointer;
    }

    .menu-btn--ghost {
      margin-top: 12px;
      background: transparent;
      border: 1px solid #555;
    }

    .menu-btn--danger { background: #c0392b; }

    .db-view {
      position: fixed;
      inset: 0;
      /* 須高於 secret-hotspot，否則右上角關閉鈕會被 90×90 透明熱區擋住 */
      z-index: 2147483647;
      background: #1a1a2e;
      color: #eee;
      display: none;
      flex-direction: column;
      overflow: hidden;
    }

    .db-view.is-open { display: flex; }

    .db-view__toolbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 12px 20px;
      background: #16213e;
      flex-shrink: 0;
    }

    .db-view__title {
      margin: 0;
      font-size: 22px;
    }

    .db-view__close {
      position: relative;
      z-index: 1;
      padding: 8px 20px;
      font-size: 16px;
      background: #e94560;
      color: #fff;
      border: none;
      border-radius: 8px;
      cursor: pointer;
    }

    .db-view__content {
      display: flex;
      flex: 1;
      min-height: 0;
    }

    .db-view__sidebar {
      width: 260px;
      padding: 20px;
      background: #0f3460;
      display: flex;
      flex-direction: column;
      gap: 16px;
      flex-shrink: 0;
    }

    .db-view__label {
      font-size: 14px;
      color: #aaa;
    }

    .db-view__date-input {
      padding: 10px 12px;
      font-size: 16px;
      border-radius: 8px;
      border: 1px solid #333;
      background: #1a1a2e;
      color: #eee;
    }

    .db-view__range-btns {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .range-btn {
      padding: 10px 14px;
      font-size: 15px;
      background: #1a1a2e;
      color: #ccc;
      border: 1px solid #444;
      border-radius: 8px;
      cursor: pointer;
      text-align: left;
    }

    .range-btn.active {
      background: #e94560;
      color: #fff;
      border-color: #e94560;
    }

    .db-view__totals {
      margin-top: 12px;
      padding-top: 12px;
      border-top: 1px solid #333;
    }

    .total-row {
      display: flex;
      justify-content: space-between;
      padding: 8px 0;
      font-size: 16px;
    }

    .total-row .total-label { color: #aaa; }
    .total-row .total-value { font-weight: bold; color: #fff; }
    .total-row--test .total-value { color: #f39c12; }

    .db-view__main {
      flex: 1;
      min-height: 0;
      padding: 20px;
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }

    .db-view__table-scroll {
      flex: 1;
      min-height: 0;
      overflow: auto;
    }

    .db-view__table {
      width: 100%;
      border-collapse: collapse;
      font-size: 14px;
      border: 1px solid #333;
      border-radius: 8px;
      overflow: hidden;
    }

    .db-view__table th,
    .db-view__table td {
      padding: 10px 14px;
      text-align: left;
      border-bottom: 1px solid #333;
    }

    .db-view__table th {
      background: #16213e;
      color: #aaa;
      font-weight: 600;
    }

    .db-view__error { color: #e94560; margin: 0; }
    .db-view__loading { color: #aaa; margin: 0; }
    .db-view__empty { text-align: center; color: #888; padding: 24px; }
  </style>
</head>

<body>
  <div id="step0" class="idle-screen" aria-label="待機畫面">
    <div class="idle-carousel" id="idleCarousel">
      <div class="idle-carousel__slide is-active" style="background-image:url('picture/AdPage/1.png')"></div>
      <div class="idle-carousel__slide" style="background-image:url('picture/AdPage/2.png')"></div>
    </div>
  </div>

  <div id="step1" class="input-screen" style="display:none;" aria-label="輸入載具">
    <div class="input-screen__bg" style="background-image:url('picture/InputPage/1.png')"></div>
    <div class="input-screen__content">
      <input id="input" placeholder="/JNXJ3S0（或輸入 7 碼：JNXJ3S0）" autocomplete="off" spellcheck="false" inputmode="text" />

      <div id="err" class="err"></div>

      <div class="barcodeBox" aria-label="barcode">
        <svg id="barcode"></svg>
      </div>

      <div class="simple-keyboard"></div>
    </div>
  </div>

  <div id="stepPrint" class="print-screen" style="display:none;" aria-label="列印中">
    <div class="print-screen__bg" style="background-image:url('picture/PrintPage/1.png')"></div>
  </div>

  <div id="step2" class="choose-screen" style="display:none;" aria-label="選擇版型">
    <div class="choose-screen__bg" style="background-image:url('picture/ChoosePage/1.png')"></div>
    <div class="choose-screen__content">
    <div class="choose-screen__templates">
      <h2 class="title choose-screen__section-title">選擇卡面樣式</h2>
      <div class="choose-screen__templates-row">
        <div>
          <div class="card-templates" id="frontTemplateSelector"></div>
        </div>
        <div id="backTemplatePanel">
          <h2 class="title" style="font-size:20px; margin-top:0; margin-bottom:12px; text-align:center;">二面樣式</h2>
          <div class="card-templates" id="backTemplateSelector"></div>
        </div>
      </div>
    </div>
    <p id="printWhatHint" class="hint" style="margin-top:12px; margin-bottom:0; text-align:center;">列印內容</p>
    <div id="printWhatOptions" class="print-options" style="margin-top:8px; display:flex; justify-content:center; gap:18px; flex-wrap:wrap;">
      <label style="display:flex; align-items:center; gap:8px; font-size:16px; cursor:pointer; user-select:none;">
        <input type="radio" name="printWhat" value="carrier" checked />
        列印載具（合成圖）
      </label>
      <label style="display:flex; align-items:center; gap:8px; font-size:16px; cursor:pointer; user-select:none;">
        <input type="radio" name="printWhat" value="img001" />
        列印 001.jpg
      </label>
      <label style="display:flex; align-items:center; gap:8px; font-size:16px; cursor:pointer; user-select:none;">
        <input type="radio" name="printWhat" value="giant0102" />
        列印 titan01 / titan02（雙面）
      </label>
    </div>
    <p id="printDuplexHint" class="hint" style="margin-top:10px; margin-bottom:0; text-align:center;">列印方式</p>
    <div id="printDuplexOptions" class="print-options" style="margin-top:8px; display:flex; justify-content:center; gap:18px; flex-wrap:wrap;">
      <label style="display:flex; align-items:center; gap:8px; font-size:16px; cursor:pointer; user-select:none;">
        <input type="radio" name="printDuplex" value="simplex" checked />
        單面列印
      </label>
      <label style="display:flex; align-items:center; gap:8px; font-size:16px; cursor:pointer; user-select:none;">
        <input type="radio" name="printDuplex" value="duplex" />
        雙面列印
      </label>
    </div>
    <p id="duplexFlipCompHint" class="hint" style="margin-top:10px; margin-bottom:0; text-align:center;">雙面翻面補償（各樣式／001 各別記憶；不會改印表機橫向紙張）</p>
    <div id="duplexFlipCompOptions" class="print-options" style="margin-top:8px; display:flex; justify-content:center; gap:14px; flex-wrap:wrap;">
      <label style="display:flex; align-items:center; gap:8px; font-size:15px; cursor:pointer; user-select:none;">
        <input type="radio" name="printLandscapeAnnot" value="auto" checked />
        自動
      </label>
      <label style="display:flex; align-items:center; gap:8px; font-size:15px; cursor:pointer; user-select:none;">
        <input type="radio" name="printLandscapeAnnot" value="landscape" />
        橫版
      </label>
      <label style="display:flex; align-items:center; gap:8px; font-size:15px; cursor:pointer; user-select:none;">
        <input type="radio" name="printLandscapeAnnot" value="portrait" />
        直版
      </label>
    </div>
    </div>
    <div class="choose-screen__preview-section">
      <h2 class="title">成品預覽</h2>

  <div id="dbView" class="db-view" aria-label="觀看資料庫">
    <div class="db-view__toolbar">
      <h1 class="db-view__title">觀看資料庫</h1>
      <button type="button" class="db-view__close" id="dbViewClose">關閉</button>

    <div class="db-view__content">
      <aside class="db-view__sidebar">
        <label class="db-view__label" for="dbViewDate">選擇日期</label>

          <div class="total-row">

            <thead>
              <tr>
                <th>流水序號</th>
                <th>日期</th>
                <th>時間</th>
                <th>是否為測試</th>
                <th>收取金額</th>

  <script src="lib/simple-keyboard/index.js"></script>
  <script src="lib/jsbarcode/JsBarcode.all.min.js"></script>

  <script>
    const Keyboard = window.SimpleKeyboard.default;
    const inputEl = document.querySelector("#input");
    const errEl = document.querySelector("#err");

    // 圖片改由 https://app.local/ 直接讀取本機檔案（WebView2 虛擬網域，無需預載 base64）
    window.__ALLOW_BACK_TEMPLATE_SELECTION__ = true;
    window.__PRINT_CARRIER_ON_BACK__ = true;
    window.__PRINT_CARRIER_BARCODE_ENABLED__ = true;
    window.__SAVE_PRINT_IMAGE__ = true;
    window.__BILL_ACCEPTOR_ENABLED__ = true;
    window.__CARRIER_LAYOUT_CONFIG__ = null;

    var templateSelectorsReady = false;

    function ensureTemplateSelectorsReady() {
      if (templateSelectorsReady) return;
      templateSelectorsReady = true;
      renderTemplateSelectors();
      bindTemplateClickHandlers();
      syncTemplateUI();
    }

    function enterTemplateStepAfterGenerate() {
      showStep("template");
      selectedFrontTemplate = 1;
      selectedBackTemplate = 1;
      activeLandscapeStorageKey = selectedFrontTemplate;
      syncLandscapeUIFromKey(activeLandscapeStorageKey);
      setPreviewCardSide(false);
      ensureTemplateSelectorsReady();
      syncTemplateUI();
      renderPreview(selectedFrontTemplate, selectedBackTemplate);
    }
    var currentStep = "idle";
    var printPageReturnTimer = null;
    const PRINT_PAGE_DURATION_MS = 40000;
    var paidAccumulated = 0;
    var billAcceptorEnabled = true;
    var kioskEnabled = true;
    /** 本次流程是否為測試（雙擊空白鍵／無紙鈔機點擊進入） */
    var sessionIsTest = false;
    var idleSpaceTapCount = 0;
    var idleSpaceLastAt = 0;
    var IDLE_SPACE_RESET_MS = 600;

    var IDLE_CAROUSEL_INTERVAL_MS = 5000;
    var idleCarouselTimer = null;
    var idleCarouselIndex = 0;

    function syncIdleCarouselSlide() {
      var slides = document.querySelectorAll("#step0 .idle-carousel__slide");
      slides.forEach(function(slide, i) {
        slide.classList.toggle("is-active", i === idleCarouselIndex);
      });
    }

    function startIdleCarousel() {
      stopIdleCarousel();
      var slides = document.querySelectorAll("#step0 .idle-carousel__slide");
      if (!slides.length) return;
      idleCarouselIndex = 0;
      syncIdleCarouselSlide();
      if (slides.length <= 1) return;
      idleCarouselTimer = setInterval(function() {
        idleCarouselIndex = (idleCarouselIndex + 1) % slides.length;
        syncIdleCarouselSlide();
      }, IDLE_CAROUSEL_INTERVAL_MS);
    }

    function stopIdleCarousel() {
      if (idleCarouselTimer != null) {
        clearInterval(idleCarouselTimer);
        idleCarouselTimer = null;
      }
    }

    function postHostEvent(payload) {
      if (window.chrome && window.chrome.webview) {
        window.chrome.webview.postMessage(JSON.stringify(payload));
      }
    }

    function handlePaidAmount(amount) {
      if (amount <= 0 || currentStep !== "idle") return;
      paidAccumulated += amount;
      if (paidAccumulated >= 100) {
        paidAccumulated -= 100;
        setTimeout(function() { goToCarrierInput(false); }, 1000);
      }
    }

    function syncBillAcceptorState() {
      if (!billAcceptorEnabled) {
        postHostEvent({ "@event": "bill_acceptor_control", enabled: false });
        return;
      }
      postHostEvent({ "@event": "bill_acceptor_control", enabled: currentStep === "idle" });
    }

    function showStep(step) {
      currentStep = step;
      if (step !== "idle") {
        idleSpaceTapCount = 0;
        idleSpaceLastAt = 0;
        stopIdleCarousel();
      }
      document.getElementById("step0").style.display = step === "idle" ? "block" : "none";
      document.getElementById("step1").style.display = step === "input" ? "block" : "none";
      document.getElementById("stepPrint").style.display = step === "print" ? "block" : "none";
      document.getElementById("step2").style.display = step === "template" ? "flex" : "none";

      var idleScreen = document.getElementById("step0");
      if (idleScreen) {
        idleScreen.classList.toggle("is-click-to-start", !billAcceptorEnabled);
      }

      syncBillAcceptorState();
      if (step === "idle") startIdleCarousel();
      if (step === "input") focusCarrierInput();
    }

    function goToCarrierInput(asTest) {
      sessionIsTest = !!asTest;
      if (sessionIsTest) {
        callHost("log_payment", { amount: 100, isTest: true }).catch(function() {});
      }
      showStep("input");
    }

    function isIdleBypassBlocked() {
      var overlay = document.getElementById("secretOverlay");
      if (overlay && overlay.style.display === "flex") return true;
      var dbView = document.getElementById("dbView");
      if (dbView && dbView.classList.contains("is-open")) return true;
      return false;
    }

    document.addEventListener("keydown", function(e) {
      if (currentStep !== "idle" || isIdleBypassBlocked()) return;
      if (e.key !== " " && e.code !== "Space") return;
      if (e.repeat) return;

      e.preventDefault();
      var now = Date.now();
      if (idleSpaceLastAt && now - idleSpaceLastAt > IDLE_SPACE_RESET_MS) {
        idleSpaceTapCount = 0;
      }
      idleSpaceLastAt = now;
      idleSpaceTapCount += 1;
      if (idleSpaceTapCount >= 2) {
        idleSpaceTapCount = 0;
        idleSpaceLastAt = 0;
        goToCarrierInput(true);
      }
    }, true);

    function clearPrintPageReturnTimer() {
      if (printPageReturnTimer) {
        clearTimeout(printPageReturnTimer);
        printPageReturnTimer = null;
      }
    }

    function enterPrintPage() {
      clearPrintPageReturnTimer();
      showStep("print");
      printPageReturnTimer = setTimeout(function() {
        printPageReturnTimer = null;
        resetSessionToIdle();
      }, PRINT_PAGE_DURATION_MS);
    }

    function resetSessionToIdle() {
      clearPrintPageReturnTimer();
      keyboard.clearInput();
      keyboardSyncedValue = "";
      inputEl.value = "";
      clearErr();
      document.querySelector("#barcode").innerHTML = "";
      setPreviewCardSide(false);
      sessionIsTest = false;
      showStep("idle");
    }

    if (window.chrome && window.chrome.webview) {
      window.chrome.webview.addEventListener("message", function(e) {
        var d = typeof e.data === "string" ? JSON.parse(e.data) : e.data;
        if (!d) return;
        var eventType = d["@event"] || d.event;
        if (eventType === "paid") {
          var amount = typeof d.amount === "number" ? d.amount : Number(d.amount) || 0;
          handlePaidAmount(amount);
          return;
        }
        if (d.type === "setCarrierTemplateOptions") {
          if (typeof d.allowBackTemplateSelection === "boolean") {
            window.__ALLOW_BACK_TEMPLATE_SELECTION__ = d.allowBackTemplateSelection;
          }
          if (typeof d.printBarcodeOnBack === "boolean") {
            window.__PRINT_CARRIER_ON_BACK__ = d.printBarcodeOnBack;
          }
          if (typeof d.printBarcodeEnabled === "boolean") {
            window.__PRINT_CARRIER_BARCODE_ENABLED__ = d.printBarcodeEnabled;
          }
          syncBackTemplatePanelVisibility();
          syncTemplateUI();
        }
        if (d.type === "setCarrierLayoutConfig" && d.config) {
          window.__CARRIER_LAYOUT_CONFIG__ = d.config;
          if (typeof applyCarrierLayoutDefaults === "function") {
            applyCarrierLayoutDefaults();
          }
        }
        if (d.type === "setCarrierUiOptions") {
          if (typeof d.showDuplexFlipCompensation === "boolean") {
            window.__SHOW_DUPLEX_FLIP_COMPENSATION__ = d.showDuplexFlipCompensation;
          }
          if (typeof syncDuplexFlipCompensationVisibility === "function") {
            syncDuplexFlipCompensationVisibility();
          }
        }
        if (d.type === "setPrintSaveOptions" && typeof d.savePrintImage === "boolean") {
          window.__SAVE_PRINT_IMAGE__ = d.savePrintImage;
        }
        if (d.type === "setBillAcceptorConfig") {
          billAcceptorEnabled = d.enabled !== false;
          window.__BILL_ACCEPTOR_ENABLED__ = billAcceptorEnabled;
          var idlePanel = document.getElementById("step0");
          if (idlePanel) {
            idlePanel.classList.toggle("is-click-to-start", !billAcceptorEnabled);
          }
          syncBillAcceptorState();
        }
        if (d.type === "setKioskConfig" && typeof d.kioskEnabled === "boolean") {
          kioskEnabled = d.kioskEnabled;
          if (typeof syncSecretExitAppVisibility === "function") {
            syncSecretExitAppVisibility();
          }
        }
      });
    }

    document.getElementById("step0").addEventListener("click", function() {
      if (billAcceptorEnabled) return;
      goToCarrierInput(true);
    });

    window.__simulatePaid = handlePaidAmount;

    let selectedFrontTemplate = 1;
    let selectedBackTemplate = 1;
    let previewShowingBack = false;
    const TEMPLATE_COUNT = 12;
    /** 樣式 1～12 與 001 列印各自儲存：'auto'|'landscape'|'portrait' */
    const printLandscapeByTemplate = Object.assign(
      Object.fromEntries(Array.from({ length: TEMPLATE_COUNT }, function(_, i) { return [i + 1, "auto"]; })),
      { img001: "auto", giant0102: "auto" }
    );
    /** 目前畫面上「圖檔方向」對應的儲存鍵：1～12 或 'img001' 或 'giant0102' */
    let activeLandscapeStorageKey = 1;

    function normalizeDuplexFlipCompensationValue(value) {
      var v = String(value || "").trim().toLowerCase();
      if (v === "auto" || v === "landscape" || v === "portrait") return v;
      return null;
    }

    function normalizePrintDuplexValue(value) {
      var v = String(value || "").trim().toLowerCase();
      if (v === "duplex" || v === "double" || v === "雙面") return "duplex";
      if (v === "simplex" || v === "single" || v === "單面") return "simplex";
      return null;
    }

    function syncPrintDuplexUIFromConfig() {
      var cfg = window.__CARRIER_LAYOUT_CONFIG__;
      var mode = normalizePrintDuplexValue(cfg && cfg.defaultPrintDuplex) || "simplex";
      document.querySelectorAll('input[name="printDuplex"]').forEach(function(r) {
        r.checked = r.value === mode;
      });
    }

    function isDuplexPrintSelected() {
      return (document.querySelector('input[name="printDuplex"]:checked')?.value === "duplex");
    }

    function applyCarrierLayoutDefaults() {
      applyDuplexFlipCompensationDefaults();
      syncPrintDuplexUIFromConfig();
    }

    function applyDuplexFlipCompensationDefaults() {
      var cfg = window.__CARRIER_LAYOUT_CONFIG__;
      var fallback = normalizeDuplexFlipCompensationValue(cfg && cfg.defaultDuplexFlipCompensation) || "auto";
      Array.from({ length: TEMPLATE_COUNT }, function(_, i) { return i + 1; }).concat(["img001", "giant0102"]).forEach(function(key) {
        printLandscapeByTemplate[key] = fallback;
      });
      syncLandscapeUIFromKey(activeLandscapeStorageKey);
    }

    function syncDuplexFlipCompensationVisibility() {
      var show = window.__SHOW_DUPLEX_FLIP_COMPENSATION__ !== false;
      ["printWhatHint", "printWhatOptions", "printDuplexHint", "printDuplexOptions", "duplexFlipCompHint", "duplexFlipCompOptions"].forEach(function(id) {
        var el = document.getElementById(id);
        if (el) el.style.display = show ? "" : "none";
      });
    }

    function flushLandscapeToStorageKey(key) {
      if (window.__SHOW_DUPLEX_FLIP_COMPENSATION__ === false) return;
      const el = document.querySelector('input[name="printLandscapeAnnot"]:checked');
      if (el) printLandscapeByTemplate[key] = el.value;
    }

    function syncLandscapeUIFromKey(key) {
      const v = printLandscapeByTemplate[key] || "auto";
      document.querySelectorAll('input[name="printLandscapeAnnot"]').forEach(function(r) {
        r.checked = r.value === v;
      });
    }

    function setLandscapeContext(newKey) {
      flushLandscapeToStorageKey(activeLandscapeStorageKey);
      activeLandscapeStorageKey = newKey;
      syncLandscapeUIFromKey(activeLandscapeStorageKey);
    }

    function syncTemplateUI() {
      if (!window.__ALLOW_BACK_TEMPLATE_SELECTION__) {
        selectedBackTemplate = selectedFrontTemplate;
      }
      var frontEls = document.querySelectorAll("#frontTemplateSelector .card-option");
      frontEls.forEach(function(el) {
        var t = parseInt(el.getAttribute("data-template") || "1", 10);
        el.classList.toggle("selected", t === selectedFrontTemplate);
      });

      var backEls = document.querySelectorAll("#backTemplateSelector .card-option");
      backEls.forEach(function(el) {
        var t = parseInt(el.getAttribute("data-template") || "1", 10);
        el.classList.toggle("selected", t === selectedBackTemplate);
      });
    }

    // 手機條碼載具：總長 8（/ + 7）
    const MAX_LEN = 8;

    function showErr(msg) {
      errEl.textContent = msg;
      errEl.style.display = "block";
    }
    function clearErr() {
      errEl.textContent = "";
      errEl.style.display = "none";
    }

    function normalize(value) {
      let cleaned = (value || "")
        .toUpperCase()
        .replace(/[^A-Z0-9+\-\./]/g, "");

      // 只輸入 7 碼時自動補 /
      if (cleaned.length === 7 && cleaned[0] !== "/") cleaned = "/" + cleaned;

      cleaned = cleaned.slice(0, MAX_LEN);
      return cleaned;
    }

    function isValidCarrier(v) {
      // / + 7 碼（A-Z 0-9 + - .）
      return /^\/[A-Z0-9+\-\.]{7}$/.test(v);
    }

    function isStep1Visible() {
      return currentStep === "input";
    }

    var keyboardSyncedValue = "";

    /** 僅在值真的改變時才呼叫 setInput，避免 simple-keyboard 整排重繪造成卡頓 */
    function syncKeyboardInput(value) {
      var fixed = normalize(value);
      if (fixed === keyboardSyncedValue) return fixed;
      keyboardSyncedValue = fixed;
      keyboard.setInput(fixed);
      return fixed;
    }

    function isInsideSimpleKeyboard(el) {
      return !!(el && el.closest && el.closest(".simple-keyboard"));
    }

    /** 確保載具欄位取得鍵盤／掃描器輸入，並與螢幕鍵盤同步 */
    function focusCarrierInput() {
      try { inputEl.focus({ preventScroll: true }); } catch (_) { inputEl.focus(); }
      syncKeyboardInput(inputEl.value);
    }

    /**
     * USB 掃描器（鍵盤楔入）在焦點落在螢幕鍵盤按鈕等元素時，字元不會進入輸入框。
     * 於第一步用 capture 階段接收可列印字元與 Enter，強制寫入 #input。
     */
    document.addEventListener(
      "keydown",
      function(e) {
        if (!isStep1Visible()) return;
        if (e.ctrlKey || e.altKey || e.metaKey) return;
        if (e.target === inputEl) return;
        if (isInsideSimpleKeyboard(e.target)) return;

        var key = e.key;
        if (key === "Enter") {
          e.preventDefault();
          generate();
          return;
        }

        if (key === "Backspace") {
          e.preventDefault();
          var cut = normalize(inputEl.value.slice(0, -1));
          inputEl.value = cut;
          syncKeyboardInput(cut);
          return;
        }

        if (key.length === 1 && /[A-Za-z0-9+\-\.\/]/.test(key)) {
          e.preventDefault();
          var next = normalize(inputEl.value + key);
          inputEl.value = next;
          syncKeyboardInput(next);
          clearErr();
        }
      },
      true
    );

    // 條碼下方字串水平位移（像素，負值往左）
    const CARRIER_BARCODE_TEXT_OFFSET_X = -3;

    function renderBarcode(carrier) {
      const svg = document.querySelector("#barcode");
      if (!svg) return;
      svg.replaceChildren();
      if (window.__PRINT_CARRIER_BARCODE_ENABLED__ === false) return;
      JsBarcode(svg, carrier, {
        format: "CODE39",
        width: 2,
        height: 70,
        // 巨人 height: 70,
        // 巨人2 height: 90,
        // 布丁狗 height: 80,
        margin: 6,
        displayValue: true,
        fontSize: 15,
        // 布丁狗 fontSize: 15,
        // 巨人2 fontSize: 13,
        textMargin: 0,
        background: "transparent",
        lineColor: "#000000"
      });

      if (CARRIER_BARCODE_TEXT_OFFSET_X !== 0) {
        var textEl = svg.querySelector("text");
        if (textEl) {
          var x = parseFloat(textEl.getAttribute("x") || "0");
          if (!isNaN(x)) {
            textEl.setAttribute("x", String(x + CARRIER_BARCODE_TEXT_OFFSET_X));
          }
        }
      }
    }

    const FRONT_TEMPLATE_IMAGES = Array.from({ length: TEMPLATE_COUNT }, function(_, i) {
      return "picture/head/" + (i + 1) + ".jpg";
    });
    const BACK_TEMPLATE_IMAGES = Array.from({ length: TEMPLATE_COUNT }, function(_, i) {
      return "picture/back/" + (i + 1) + ".jpg";
    });

    function getFrontTemplateImagePath(idx) {
      return FRONT_TEMPLATE_IMAGES[idx - 1] || FRONT_TEMPLATE_IMAGES[0];
    }

    function getBackTemplateImagePath(idx) {
      return BACK_TEMPLATE_IMAGES[idx - 1] || BACK_TEMPLATE_IMAGES[0];
    }

    function syncBackTemplatePanelVisibility() {
      var backPanel = document.getElementById("backTemplatePanel");
      var allowBackTemplateSelection = !!window.__ALLOW_BACK_TEMPLATE_SELECTION__;
      if (backPanel) {
        backPanel.style.display = allowBackTemplateSelection ? "" : "none";
      }
      if (!allowBackTemplateSelection) {
        selectedBackTemplate = selectedFrontTemplate;
      }
    }

    function renderTemplateSelectors() {
      var frontSelector = document.getElementById("frontTemplateSelector");
      var backSelector = document.getElementById("backTemplateSelector");
      if (!frontSelector || !backSelector) return;

      frontSelector.innerHTML = FRONT_TEMPLATE_IMAGES.map(function(path, i) {
        var src = toAbsoluteAssetUrl(path);
        return '<img class="card-option" data-template="' + (i + 1) + '" alt="正面樣式' + (i + 1) + '" src="' + src + '" loading="eager" decoding="async" />';
      }).join("");
      backSelector.innerHTML = BACK_TEMPLATE_IMAGES.map(function(path, i) {
        var src = toAbsoluteAssetUrl(path);
        return '<img class="card-option" data-template="' + (i + 1) + '" alt="背面樣式' + (i + 1) + '" src="' + src + '" loading="eager" decoding="async" />';
      }).join("");

      syncBackTemplatePanelVisibility();
    }

    function getPreviewFrontBackgroundUrlForTemplate(idx) {
      return toAbsoluteAssetUrl(getFrontTemplateImagePath(idx));
    }

    function getPreviewBackBackgroundUrlForTemplate(idx) {
      return toAbsoluteAssetUrl(getBackTemplateImagePath(idx));
    }

    function getPrintFrontBackgroundUrlForTemplate(idx) {
      return toAbsoluteAssetUrl(getFrontTemplateImagePath(idx));
    }

    function getPrintBackBackgroundUrlForTemplate(idx) {
      return toAbsoluteAssetUrl(getBackTemplateImagePath(idx));
    }

    function getTitanBackgroundUrl(idx) {
      return idx === 1 ? toAbsoluteAssetUrl("picture/titan01.jpg") : toAbsoluteAssetUrl("picture/titan02.jpg");
    }

    function toAbsoluteAssetUrl(relativePath) {
      var base = location.href.substring(0, location.href.lastIndexOf("/") + 1);
      var normalized = String(relativePath || "").replace(/\\/g, "/").replace(/^\/+/, "");
      var encoded = normalized
        .split("/")
        .map(function(seg) { return encodeURIComponent(seg); })
        .join("/");
      return base + encoded;
    }

    function normalizeBackgroundInput(urlOrRelativePath) {
      return toAbsoluteAssetUrl(urlOrRelativePath);
    }

    const DEFAULT_PREVIEW_BARCODE_X = 102;
    const DEFAULT_PREVIEW_BARCODE_Y = 409;
    const DEFAULT_PRINT_BARCODE_X = 104;
    const DEFAULT_PRINT_BARCODE_Y = 419;

    function getBarcodePosFromLayout(templateIndex, side, kind) {
      const layout = window.__CARRIER_LAYOUT_CONFIG__;
      const templateKey = String(templateIndex);
      const t = layout && layout.templates ? layout.templates[templateKey] : null;
      const s = t ? (side === "front" ? t.front : t.back) : null;

      const fallback = kind === "preview"
        ? { x: DEFAULT_PREVIEW_BARCODE_X, y: DEFAULT_PREVIEW_BARCODE_Y }
        : { x: DEFAULT_PRINT_BARCODE_X, y: DEFAULT_PRINT_BARCODE_Y };

      if (!s) return fallback;

      if (kind === "preview") {
        return {
          x: (s.previewBarcodeX ?? s.printBarcodeX ?? fallback.x),
          y: (s.previewBarcodeY ?? s.printBarcodeY ?? fallback.y)
        };
      }

      return {
        x: (s.printBarcodeX ?? s.previewBarcodeX ?? fallback.x),
        y: (s.printBarcodeY ?? s.previewBarcodeY ?? fallback.y)
      };
    }

    /**
     * 僅用於下載／列印：合成圖若為橫向（寬>高），順時針轉 90°，使像素為高>寬（成品預覽不經此函式）。
     * @param {HTMLCanvasElement} source
     * @returns {HTMLCanvasElement}
     */
    function rotateComposite90IfWiderThanTall(source) {
      var w = source.width;
      var h = source.height;
      if (w <= h) return source;
      var out = document.createElement("canvas");
      out.width = h;
      out.height = w;
      var o = out.getContext("2d");
      o.translate(h, 0);
      o.rotate(Math.PI / 2);
      o.drawImage(source, 0, 0);
      return out;
    }

    function drawPreviewCanvas(canvas, loadedBg, loadedBarcode, includeCarrier, barcodeX, barcodeY, widthPlus, heightPlus) {
      canvas.width = loadedBg.width;
      canvas.height = loadedBg.height;
      var ctx = canvas.getContext("2d");
      ctx.drawImage(loadedBg, 0, 0, loadedBg.width, loadedBg.height);
      if (includeCarrier && loadedBarcode) {
        var baseWidth = loadedBg.width * 0.51;
        // 巨人 baseWidth = loadedBg.width * 0.52;
        // 巨人2 baseWidth = loadedBg.width * 0.4;
        // 布丁狗 baseWidth = loadedBg.width * 0.55;
        var baseScale = baseWidth / loadedBarcode.width;
        var baseHeight = loadedBarcode.height * baseScale;
        var targetWidth = baseWidth + widthPlus;
        var targetHeight = baseHeight + heightPlus;
        ctx.drawImage(loadedBarcode, barcodeX, barcodeY, targetWidth, targetHeight);
      }
    }

    function renderPreview(frontTemplateIndex, backTemplateIndex) {
      var svg = document.querySelector("#barcode");
      if (!svg) return;

      var frontBgUrl = getPreviewFrontBackgroundUrlForTemplate(frontTemplateIndex);
      var backBgUrl = getPreviewBackBackgroundUrlForTemplate(backTemplateIndex);
      var frontBgImg = new Image();
      var backBgImg = new Image();
      var barcodeEnabled = window.__PRINT_CARRIER_BARCODE_ENABLED__ !== false;
      var barcodeImg = barcodeEnabled ? new Image() : null;
      var svgUrl = null;
      if (barcodeEnabled && svg.outerHTML && svg.innerHTML.trim() !== "") {
        var svgData = new XMLSerializer().serializeToString(svg);
        var svgBlob = new Blob([svgData], { type: "image/svg+xml;charset=utf-8" });
        svgUrl = URL.createObjectURL(svgBlob);
        barcodeImg.src = svgUrl;
      }

      var loaders = [
        new Promise(function(resolve, reject) { frontBgImg.onload = function() { resolve(frontBgImg); }; frontBgImg.onerror = function() { reject(); }; frontBgImg.src = frontBgUrl; }),
        new Promise(function(resolve, reject) { backBgImg.onload = function() { resolve(backBgImg); }; backBgImg.onerror = function() { reject(); }; backBgImg.src = backBgUrl; })
      ];
      if (barcodeEnabled && barcodeImg && svgUrl) {
        loaders.push(new Promise(function(resolve, reject) { barcodeImg.onload = function() { resolve(barcodeImg); }; barcodeImg.onerror = function() { reject(); }; barcodeImg.src = svgUrl; }));
      }

      Promise.all(loaders).then(function(imgs) {
        var loadedFrontBg = imgs[0];
        var loadedBackBg = imgs[1];
        var loadedBarcode = (barcodeEnabled && imgs.length >= 3) ? imgs[2] : null;
        var frontCanvas = document.getElementById("previewFrontCanvas");
        var backCanvas = document.getElementById("previewBackCanvas");

        var frontPos = getBarcodePosFromLayout(frontTemplateIndex, "front", "preview");
        var backPos = getBarcodePosFromLayout(backTemplateIndex, "back", "preview");

        drawPreviewCanvas(frontCanvas, loadedFrontBg, loadedBarcode, barcodeEnabled, frontPos.x, frontPos.y, 0, 0);
        drawPreviewCanvas(backCanvas, loadedBackBg, loadedBarcode, barcodeEnabled && !!window.__PRINT_CARRIER_ON_BACK__, backPos.x, backPos.y, 0, 0);
      }).catch(function(err) {
        alert("背景圖片載入失敗，無法產生預覽。");
        console.error(err);
      });
    }

    function setPreviewCardSide(showBack) {
      previewShowingBack = !!showBack;
      var el = document.getElementById("flipInner");
      if (!el) return;
      el.classList.toggle("is-back", previewShowingBack);
    }

    function initPreviewCardInteractions() {
      var card = document.getElementById("flipCard");
      if (!card) return;
      var startX = 0;
      var moved = false;
      var threshold = 45;

      card.addEventListener("click", function() {
        if (moved) return;
        setPreviewCardSide(!previewShowingBack);
      });

      card.addEventListener("pointerdown", function(e) {
        startX = e.clientX;
        moved = false;
      });

      card.addEventListener("pointermove", function(e) {
        if (!startX) return;
        var deltaX = e.clientX - startX;
        if (Math.abs(deltaX) > 8) moved = true;
      });

      card.addEventListener("pointerup", function(e) {
        if (!startX) return;
        var deltaX = e.clientX - startX;
        if (Math.abs(deltaX) > threshold) {
          setPreviewCardSide(deltaX < 0);
        }
        startX = 0;
      });

      card.addEventListener("pointercancel", function() { startX = 0; });
    }

    /** 將列印資料送給 WinForms（WebView2）；若在瀏覽器開 HTML 則無法列印到 HiTi。 */
    /** @returns {boolean|undefined} true=橫版 false=直版 undefined=自動（不傳 isLandscape） */
    function getIsLandscapeAnnotationForTemplateKey(templateKey) {
      const v = printLandscapeByTemplate[templateKey] || "auto";
      if (v === "landscape") return true;
      if (v === "portrait") return false;
      return undefined;
    }

    function getIsLandscapeAnnotation() {
      flushLandscapeToStorageKey(activeLandscapeStorageKey);
      return getIsLandscapeAnnotationForTemplateKey(activeLandscapeStorageKey);
    }

    function postCarrierImageToHost(payload, isLandscapeOverride) {
      // 先把目前 UI 選項寫回對應模板（因為可能有尚未切換 template 而尚未 flush）
      flushLandscapeToStorageKey(activeLandscapeStorageKey);

      const ann = (arguments.length >= 2)
        ? isLandscapeOverride
        : getIsLandscapeAnnotationForTemplateKey(activeLandscapeStorageKey);
      if (ann !== undefined) payload.isLandscape = ann;
      if (window.chrome && window.chrome.webview) {
        window.chrome.webview.postMessage(payload);
        return true;
      }
      alert(
        "無法送交印表機：目前不是在程式內嵌的 WebView2 中執行。\n\n" +
        "請關閉瀏覽器分頁，改為執行「Cloud-Invoice-Carrier」主程式，\n" +
        "在程式視窗內按列印，才會送到 HiTi CS-200e。"
      );
      return false;
    }

    function downloadWithBackground(filename = "carrier-with-background.png", duplex = false) {
      const svg = document.querySelector("#barcode");
      if (!svg) return false;

      // 單面：picture/head（正面樣式）；雙面：正面 head、背面 picture/back
      const frontBackgroundUrl = getPrintFrontBackgroundUrlForTemplate(selectedFrontTemplate);
      const backBackgroundUrl = duplex ? getPrintBackBackgroundUrlForTemplate(selectedBackTemplate) : null;

      const barcodeEnabled = window.__PRINT_CARRIER_BARCODE_ENABLED__ !== false;
      const barcodeImg = barcodeEnabled ? new Image() : null;
      const svgUrl = (barcodeEnabled && svg.outerHTML && svg.innerHTML.trim() !== "")
        ? URL.createObjectURL(new Blob([new XMLSerializer().serializeToString(svg)], { type: "image/svg+xml;charset=utf-8" }))
        : null;

      function loadImage(url) {
        return new Promise(function(resolve, reject) {
          const img = new Image();
          img.onload = function() { resolve(img); };
          img.onerror = function() { reject(new Error("img load fail: " + url)); };
          img.src = url;
        });
      }

      function composeOneSide(loadedBg, loadedBarcode, side, templateIndex, includeCarrier) {
        const canvas = document.createElement("canvas");
        canvas.width = loadedBg.width;
        canvas.height = loadedBg.height;
        const ctx = canvas.getContext("2d");

        ctx.drawImage(loadedBg, 0, 0, loadedBg.width, loadedBg.height);

        if (includeCarrier && loadedBarcode) {
          const baseWidth = loadedBg.width * 0.52;
          // 巨人 baseWidth = loadedBg.width * 0.52;
          // 巨人2 baseWidth = loadedBg.width * 0.4;
          // 布丁狗 baseWidth = loadedBg.width * 0.55;
          const baseScale = baseWidth / loadedBarcode.width;
          const baseHeight = loadedBarcode.height * baseScale;
          const targetWidth = baseWidth;
          const targetHeight = baseHeight;
          const pos = getBarcodePosFromLayout(templateIndex, side, "print");
          ctx.drawImage(loadedBarcode, pos.x, pos.y, targetWidth, targetHeight);
        }

        return rotateComposite90IfWiderThanTall(canvas);
      }

      var loads = [loadImage(frontBackgroundUrl)];
      if (barcodeEnabled && svgUrl) loads.push(loadImage(svgUrl));
      if (duplex) loads.push(loadImage(backBackgroundUrl));

      Promise.all(loads).then(function(imgs) {
        const loadedFrontBg = imgs[0];
        const loadedBarcode = (barcodeEnabled && svgUrl) ? imgs[1] : null;
        const loadedBackBg = duplex
          ? imgs[barcodeEnabled && svgUrl ? 2 : 1]
          : null;

        const frontOutCanvas = composeOneSide(loadedFrontBg, loadedBarcode, "front", selectedFrontTemplate, barcodeEnabled);

        if (!duplex) {
          postCarrierImageToHost({
            type: "carrierImage",
            fileName: filename,
            dataUrl: frontOutCanvas.toDataURL("image/png"),
            duplex: false
          });
        } else {
          const frontDataUrl = frontOutCanvas.toDataURL("image/png");
          const backOutCanvas = composeOneSide(loadedBackBg, loadedBarcode, "back", selectedBackTemplate, barcodeEnabled && !!window.__PRINT_CARRIER_ON_BACK__);
          const backDataUrl = backOutCanvas.toDataURL("image/png");

          postCarrierImageToHost({
            type: "carrierImage",
            fileName: filename,
            dataUrl: frontDataUrl,
            dataUrlBack: backDataUrl,
            duplex: true
          }, getIsLandscapeAnnotationForTemplateKey(selectedBackTemplate));

          // duplex 時原本只下載正面圖；維持既有行為（避免使用者端流程改動）
        }

        if (window.__SAVE_PRINT_IMAGE__) {
          frontOutCanvas.toBlob(function(blob) {
            if (!blob) return;
            const url = URL.createObjectURL(blob);
            const a = document.createElement("a");
            a.href = url;
            a.download = filename;
            document.body.appendChild(a);
            a.click();
            a.remove();
            URL.revokeObjectURL(url);
          }, "image/png");
        }
      }).catch(function(err) {
        alert("背景圖片載入失敗，無法下載或列印。");
        console.error(err);
      });

      return true;
    }

    function composeCarrierCanvas(backgroundUrl, loadedBarcode) {
      return new Promise(function(resolve, reject) {
        const bgImg = new Image();
        bgImg.onload = function() {
          const canvas = document.createElement("canvas");
          canvas.width = bgImg.width;
          canvas.height = bgImg.height;
          const ctx = canvas.getContext("2d");

          ctx.drawImage(bgImg, 0, 0, bgImg.width, bgImg.height);

          if (loadedBarcode) {
            const baseWidth = bgImg.width * 0.55;
            const baseScale = baseWidth / loadedBarcode.width;
            const baseHeight = loadedBarcode.height * baseScale;
            const targetWidth = baseWidth;
            const targetHeight = baseHeight;
            const x = 416;
            const y = 88;

            ctx.drawImage(loadedBarcode, x, y, targetWidth, targetHeight);
          }
          resolve(rotateComposite90IfWiderThanTall(canvas));
        };
        bgImg.onerror = function() { reject(new Error("bg load fail")); };
        bgImg.src = backgroundUrl;
      });
    }

    function printDuplexCompositeImages(frontBackgroundUrl, backBackgroundUrl, fileName = "carrier-duplex.png") {
      const svg = document.querySelector("#barcode");
      if (!svg) return false;
      const barcodeEnabled = window.__PRINT_CARRIER_BARCODE_ENABLED__ !== false;
      if (barcodeEnabled && (!svg.outerHTML || svg.innerHTML.trim() === "")) return false;

      const barcodeImg = barcodeEnabled ? new Image() : null;
      const svgUrl = (barcodeEnabled && svg.outerHTML && svg.innerHTML.trim() !== "")
        ? URL.createObjectURL(new Blob([new XMLSerializer().serializeToString(svg)], { type: "image/svg+xml;charset=utf-8" }))
        : null;

      (barcodeEnabled && svgUrl
        ? Promise.all([
            new Promise(function(resolve, reject) {
              barcodeImg.onload = function() { resolve(barcodeImg); };
              barcodeImg.onerror = function() { reject(new Error("barcode load fail")); };
              barcodeImg.src = svgUrl;
            })
          ]).then(function(imgs) { return imgs[0]; })
        : Promise.resolve(null)
      ).then(function(loadedBarcode) {
        return Promise.all([
          composeCarrierCanvas(normalizeBackgroundInput(frontBackgroundUrl), loadedBarcode),
          composeCarrierCanvas(normalizeBackgroundInput(backBackgroundUrl), loadedBarcode)
        ]);
      }).then(function(canvases) {
        const frontCanvas = canvases[0];
        const backCanvas = canvases[1];

        postCarrierImageToHost({
          type: "carrierImage",
          fileName: fileName,
          dataUrl: frontCanvas.toDataURL("image/png"),
          dataUrlBack: backCanvas.toDataURL("image/png"),
          duplex: true
        });
      }).catch(function(err) {
        alert("背景圖片載入失敗，無法下載或列印。\n" + (err && err.message ? err.message : ""));
        console.error(err);
      });

      return true;
    }

    function callHost(cmd, data) {
      data = data || {};
      var webview = window.chrome && window.chrome.webview;
      if (!webview) {
        return Promise.reject(new Error("目前不在 WebView2 環境"));
      }

      var id = (window.crypto && crypto.randomUUID)
        ? crypto.randomUUID()
        : ("rpc-" + Date.now() + "-" + Math.random());

      return new Promise(function(resolve, reject) {
        var timer = setTimeout(function() {
          webview.removeEventListener("message", handler);
          reject(new Error("timeout"));
        }, 60000);

        function handler(ev) {
          try {
            var res = typeof ev.data === "string" ? JSON.parse(ev.data) : ev.data;
            if (!res || res.id !== id) return;
            clearTimeout(timer);
            webview.removeEventListener("message", handler);
            if (res.ok) resolve(res.data || {});
            else reject(new Error(res.error || "unknown error"));
          } catch (err) {
            // ignore parse errors from other messages
          }
        }

        webview.addEventListener("message", handler);
        webview.postMessage(JSON.stringify({ id: id, cmd: cmd, data: data }));
      });
    }

      });

      document.getElementById("secretCancel").addEventListener("click", closeSecretMenu);
      document.getElementById("secretMenuClose").addEventListener("click", closeSecretMenu);

      document.getElementById("secretSubmit").addEventListener("click", function() {
        if (secretInput === PASSWORD) {
          keypad.style.display = "none";
          menu.style.display = "block";
          syncSecretExitAppVisibility();
          secretInput = "";
          errorEl.style.display = "none";
          renderSecretInput();
          return;
        }
        errorEl.textContent = "密碼錯誤";
        errorEl.style.display = "block";
        secretInput = "";
        renderSecretInput();
      });

      document.getElementById("secretWatchDb").addEventListener("click", function() {
        closeSecretMenu();
        openDbViewer();
      });

      document.getElementById("secretExitApp").addEventListener("click", function() {
        if (kioskEnabled) return;
        callHost("exit_app", {}).catch(function() {});
      });

      document.getElementById("secretShutdown").addEventListener("click", function() {
        callHost("shutdown", {}).catch(function() {});
      });

      document.addEventListener("keydown", function(e) {
        if (overlay.style.display !== "flex") return;
        if (e.key === "Escape") {
          e.preventDefault();
          closeSecretMenu();
          return;
        }
        if (keypad.style.display === "none") return;
        if (e.key >= "0" && e.key <= "9") {
          e.preventDefault();
          if (secretInput.length >= 8) return;
          secretInput += e.key;
          errorEl.style.display = "none";
          renderSecretInput();
        }
        if (e.key === "Backspace") {
          e.preventDefault();
          secretInput = secretInput.slice(0, -1);
          renderSecretInput();
        }
        if (e.key === "Enter") {
          e.preventDefault();
          document.getElementById("secretSubmit").click();
        }
      }, true);
    }

    function initDbViewer() {
      var dbView = document.getElementById("dbView");
      var dbDate = document.getElementById("dbViewDate");
      var dbBody = document.getElementById("dbViewBody");
      var dbError = document.getElementById("dbViewError");
      var dbLoading = document.getElementById("dbViewLoading");
      var dbTotalPrint = document.getElementById("dbTotalPrint");
      var dbTotalTest = document.getElementById("dbTotalTest");
      var rangeType = "day";

      function formatDateLocal(d) {
        var y = d.getFullYear();
        var m = String(d.getMonth() + 1).padStart(2, "0");
        var day = String(d.getDate()).padStart(2, "0");
        return y + "-" + m + "-" + day;
      }

      dbDate.value = formatDateLocal(new Date());

      function setRange(nextRange) {
        rangeType = nextRange;
        document.querySelectorAll(".range-btn").forEach(function(btn) {
          btn.classList.toggle("active", btn.getAttribute("data-range") === nextRange);
        });
        fetchDbRecords();
      }

      function fetchDbRecords() {
        dbError.style.display = "none";
        dbLoading.style.display = "block";
        dbBody.innerHTML = "";

        callHost("get_print_records", {
          date: dbDate.value,
          rangeType: rangeType
        }).then(function(data) {
          var rows = Array.isArray(data.rows) ? data.rows : [];
          dbTotalPrint.textContent = String(data.totalPrintSheets || 0);
          dbTotalTest.textContent = String(data.totalTestSheets || 0);
          if (rows.length === 0) {
            dbBody.innerHTML = '<tr><td colspan="7" class="db-view__empty">此範圍無資料</td></tr>';
            return;
          }
          dbBody.innerHTML = rows.map(function(r) {
            return "<tr>" +
              "<td>" + r.id + "</td>" +
              "<td>" + (r.date || "") + "</td>" +
              "<td>" + (r.time || "") + "</td>" +
              "<td>" + (r.isTest ? "是" : "否") + "</td>" +
              "<td>" + (r.amount || 0) + "</td>" +
              "<td>" + (r.copies || 0) + "</td>" +
              "<td>" + (r.templateName || "") + "</td>" +
              "</tr>";
          }).join("");
        }).catch(function(err) {
          dbError.textContent = err && err.message ? err.message : String(err);
          dbError.style.display = "block";
          dbTotalPrint.textContent = "0";
          dbTotalTest.textContent = "0";
          dbBody.innerHTML = '<tr><td colspan="7" class="db-view__empty">讀取失敗</td></tr>';
        }).finally(function() {
          dbLoading.style.display = "none";
        });
      }

      window.openDbViewer = function() {
        dbView.classList.add("is-open");
        var hotspot = document.getElementById("secretHotspot");
        if (hotspot) hotspot.style.display = "none";
        fetchDbRecords();
      };

      window.closeDbViewer = function() {
        dbView.classList.remove("is-open");
        var hotspot = document.getElementById("secretHotspot");
        if (hotspot) hotspot.style.display = "";
        showStep("idle");
      };

      document.getElementById("dbViewClose").addEventListener("click", function(e) {
        e.stopPropagation();
        window.closeDbViewer();
      });
      dbDate.addEventListener("change", fetchDbRecords);
      document.querySelectorAll(".range-btn").forEach(function(btn) {
        btn.addEventListener("click", function() {
          setRange(btn.getAttribute("data-range") || "day");
        });
      });
    }
  </script>
</body>
</html>
